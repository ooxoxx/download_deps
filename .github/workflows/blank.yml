name: Build Windows Portable Python Environment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-python-env.yml'

jobs:
  build-env:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download Python 3.10 Embeddable
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "python-env"

      - name: 3. Enable site-packages and Install pip
        run: |
          cd python-env
          (Get-Content python310._pth) -replace '#import site', 'import site' | Set-Content python310._pth
          
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\python.exe get-pip.py
          Remove-Item get-pip.py

      - name: 4. Install Required Packages
        run: |
          cd python-env
          # 新增 "urllib3<2.0.0" 限制，解决 selenium 3.x 初始化的崩溃问题
          .\python.exe -m pip install "numpy<2.0.0" "urllib3<2.0.0" "pandas==2.*" "selenium==3.*" "tqdm==4.*"
          
          .\python.exe -m pip cache purge

      - name: 5. Validate Environment (Test Imports & Selenium Init)
        run: |
          cd python-env
          # 验证基础库导入，并加入 Selenium 驱动初始化测试
          # 使用 --headless 无头模式在后台尝试拉起 Chrome
          .\python.exe -c "import pandas; import tqdm; from selenium import webdriver; options = webdriver.ChromeOptions(); options.add_argument('--headless'); options.add_argument('--disable-gpu'); driver = webdriver.Chrome(options=options); driver.quit(); print('Validation Passed: Selenium initialized successfully!')"

      - name: 6. Compress Environment Package
        run: |
          Compress-Archive -Path python-env\* -DestinationPath windows-python-env.zip

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-python-3.10-env
          path: windows-python-env.zip
          retention-days: 7
