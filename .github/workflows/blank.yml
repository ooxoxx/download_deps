name: Build Windows Portable Python Environment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-python-env.yml'

jobs:
  build-env:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download Python 3.10 Embeddable
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "python-env"

      - name: 3. Enable site-packages and Install pip
        run: |
          cd python-env
          (Get-Content python310._pth) -replace '#import site', 'import site' | Set-Content python310._pth
          
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\python.exe get-pip.py
          Remove-Item get-pip.py

      - name: 4. Install Required Packages (Major Version Only)
        run: |
          cd python-env
          # 仅锁定大版本 (==X.*)，自动获取该系列下的最新小版本
          # 依然保留 numpy 限制以防止早期 pandas 2.x 的 C 底层冲突
          .\python.exe -m pip install "numpy<2.0.0" "pandas==2.*" "selenium==3.*" "tqdm==4.*"
          
          .\python.exe -m pip cache purge

      - name: 5. Validate Environment (Test Imports)
        run: |
          cd python-env
          # 验证所有包是否安装成功且没有底层依赖冲突
          .\python.exe -c "import numpy; import pandas; import selenium; import tqdm; print('✅ 验证成功：所有指定的依赖包均可正常导入！')"

      - name: 6. Compress Environment Package
        run: |
          Compress-Archive -Path python-env\* -DestinationPath windows-python-env.zip

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-python-3.10-env
          path: windows-python-env.zip
          retention-days: 7
