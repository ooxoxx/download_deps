name: Build Windows Portable Python & Selenium Env

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-python-env.yml'

jobs:
  build-env:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download Python 3.10 Embeddable
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "python-env"

      - name: 3. Download Portable Chrome & Chromedriver
        run: |
          $cft_version = "126.0.6478.182"
          
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-for-testing-public/$cft_version/win64/chrome-win64.zip" -OutFile "chrome.zip"
          Expand-Archive -Path "chrome.zip" -DestinationPath "temp_chrome"
          Move-Item -Path "temp_chrome\chrome-win64" -Destination "python-env\chrome"
          
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-for-testing-public/$cft_version/win64/chromedriver-win64.zip" -OutFile "chromedriver.zip"
          Expand-Archive -Path "chromedriver.zip" -DestinationPath "temp_driver"
          Move-Item -Path "temp_driver\chromedriver-win64\chromedriver.exe" -Destination "python-env\"

      - name: 4. Enable site-packages and Install pip
        run: |
          cd python-env
          (Get-Content python310._pth) -replace '#import site', 'import site' | Set-Content python310._pth
          
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\python.exe get-pip.py
          Remove-Item get-pip.py

      - name: 5. Install Required Packages
        run: |
          cd python-env
          # 正常安装包，暂时不清理缓存，以便下一步能快速导出
          .\python.exe -m pip install "numpy<2.0.0" "urllib3<2.0.0" "pandas==2.*" "selenium==3.*" "tqdm==4.*" "openpyxl==3.*"

      - name: 6. Export Offline WHL Packages
        run: |
          # 创建一个用于存放离线包的目录 (在 python-env 外面，避免影响绿色环境体积)
          New-Item -ItemType Directory -Force -Path "offline_wheels"
          
          cd python-env
          # 使用 pip download 下载所有的离线安装包（由于刚才安装过，这里会极速命中本地缓存并复制出 whl 文件）
          .\python.exe -m pip download -d "..\offline_wheels" "numpy<2.0.0" "urllib3<2.0.0" "pandas==2.*" "selenium==3.*" "tqdm==4.*" "openpyxl==3.*"
          
          # 导出完成后，清理掉没用的 pip 缓存
          .\python.exe -m pip cache purge

      - name: 7. Inject Zero-Config Selenium Hook (Monkeypatch)
        run: |
          $hook_code = @"
          import os
          import sys

          try:
              from selenium.webdriver.chrome.webdriver import WebDriver as ChromeWebDriver
              from selenium.webdriver.chrome.options import Options as ChromeOptions
              
              original_init = ChromeWebDriver.__init__
              
              def new_init(self, executable_path='chromedriver', port=0,
                           options=None, service_args=None,
                           desired_capabilities=None, service_log_path=None,
                           chrome_options=None, keep_alive=True):
                  
                  env_dir = os.path.dirname(sys.executable)
                  portable_chrome = os.path.join(env_dir, 'chrome', 'chrome.exe')
                  portable_driver = os.path.join(env_dir, 'chromedriver.exe')
                  
                  if options is None:
                      options = ChromeOptions()
                  
                  if os.path.exists(portable_chrome) and not options.binary_location:
                      options.binary_location = portable_chrome
                      
                  if executable_path == 'chromedriver' and os.path.exists(portable_driver):
                      executable_path = portable_driver
                      
                  original_init(self, executable_path=executable_path, port=port,
                                options=options, service_args=service_args,
                                desired_capabilities=desired_capabilities,
                                service_log_path=service_log_path,
                                chrome_options=chrome_options, keep_alive=keep_alive)
                                
              ChromeWebDriver.__init__ = new_init
          except ImportError:
              pass
          "@
          
          $out_path = "python-env\Lib\site-packages\sitecustomize.py"
          Out-File -FilePath $out_path -InputObject $hook_code -Encoding utf8

      - name: 8. Validate Environment (True Zero-Config Test)
        run: |
          cd python-env
          .\python.exe -c "import pandas; import tqdm; import openpyxl; from selenium import webdriver; options = webdriver.ChromeOptions(); options.add_argument('--headless'); driver = webdriver.Chrome(options=options); print('Browser Title:', driver.execute_script('return document.title')); driver.quit(); print('Validation Passed: Zero-Config Selenium & openpyxl initialized successfully!')"

      - name: 9. Compress Environment Package & Wheels
        run: |
          # 压缩主环境 (便携版)
          Compress-Archive -Path python-env\* -DestinationPath windows-python-env.zip
          
          # 压缩纯离线依赖包
          Compress-Archive -Path offline_wheels\* -DestinationPath offline-wheels.zip

      - name: 10. Upload Portable Environment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-python-3.10-env
          path: windows-python-env.zip
          retention-days: 7

      - name: 11. Upload Offline Wheels Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-wheels-packages
          path: offline-wheels.zip
          retention-days: 7
